name: Doctrine Scan

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

jobs:
  doctrine-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine scanner selftest gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          run_selftests=true
          event_name="${{ github.event_name }}"
          base_sha=""
          head_sha="${{ github.sha }}"

          if [[ "$event_name" == "workflow_dispatch" ]]; then
            run_selftests=true
          elif [[ "$event_name" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
          elif [[ "$event_name" == "push" ]]; then
            base_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"
          fi

          if [[ "$event_name" != "workflow_dispatch" ]]; then
            if [[ -z "$base_sha" || -z "$head_sha" || "$base_sha" =~ ^0+$ ]]; then
              run_selftests=true
            elif git cat-file -e "${base_sha}^{commit}" && git cat-file -e "${head_sha}^{commit}"; then
              changed_files="$(mktemp)"
              if git diff --name-only "${base_sha}..${head_sha}" >"$changed_files"; then
                if grep -Eq '^(scripts/ci/|\.github/workflows/)' "$changed_files"; then
                  run_selftests=true
                else
                  run_selftests=false
                fi
              else
                run_selftests=true
              fi
            else
              run_selftests=true
            fi
          fi

          echo "run_selftests=${run_selftests}" >>"$GITHUB_OUTPUT"
          echo "scanner selftests: ${run_selftests}"

      - name: Ensure ripgrep (pinned stock build)
        run: |
          set -euo pipefail
          # Pin a STOCK official release. The apt package version floats with the
          # runner image, and CI-A-SELFTEST-0R (47ec2469) abandoned `rg -n`
          # precisely because behaviour "varied with rg build/invocation". Pinning
          # removes the variance instead of working around it. PCRE2 is NOT
          # required -- no CI script uses -P/--pcre2 -- so a stock build suffices.
          RG_VERSION=14.1.1
          if ! rg --version 2>/dev/null | head -1 | grep -q "ripgrep ${RG_VERSION}$"; then
            tmp="$(mktemp -d)"
            curl -fsSL -o "$tmp/rg.tar.gz"               "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz"
            tar -xzf "$tmp/rg.tar.gz" -C "$tmp"
            sudo install -m 0755 "$tmp"/ripgrep-*/rg /usr/local/bin/rg
            hash -r
          fi

      - name: ripgrep capability assertion
        run: |
          # Assert, do not assume. Same script runs on a developer's Windows box,
          # so a capability difference surfaces as a named failure rather than as
          # a scan whose output quietly changes shape.
          bash scripts/ci/rg_capability_check.sh

      - name: ripgrep capability selftest
        # Gated like every other selftest (R1-TEST-PURGE / whole-tree-is-maintainer).
        # The ASSERTION above runs on every PR because a wrong rg silently changes
        # scan output; the SELFTEST proves the assertion can fail, which only the
        # maintainer path needs.
        if: steps.gate.outputs.run_selftests == 'true'
        run: |
          bash scripts/ci/rg_capability_check.sh --selftest

      - name: Scanner selftest gate guard
        run: |
          set -o pipefail
          bash scripts/ci/selftest_gate_guard.sh 2>&1 | tee doctrine-selftest-gate-guard-report.txt

      - name: Sanctioned surface digest freshness
        run: |
          set -o pipefail
          bash scripts/ci/gen_digest.sh --check 2>&1 | tee doctrine-digest-report.txt

      - name: Orientation digest freshness
        run: |
          set -o pipefail
          bash scripts/ci/gen_orientation.sh --check 2>&1 | tee doctrine-orientation-report.txt

      - name: Plan struct typing census
        run: |
          set -o pipefail
          bash scripts/ci/plan_struct_typing_census.sh 2>&1 | tee doctrine-plan-struct-typing-census-report.txt

      - name: Write-door band delta census
        run: |
          set -o pipefail
          bash scripts/ci/write_door_band_delta_census.sh 2>&1 | tee doctrine-write-door-band-delta-census-report.txt

      - name: Constitutional surface census
        run: |
          set -o pipefail
          bash scripts/ci/constitutional_surface_check.sh --check 2>&1 | tee doctrine-constitutional-surface-report.txt

      - name: Constitutional surface census selftest
        if: steps.gate.outputs.run_selftests == 'true'
        run: |
          set -o pipefail
          bash scripts/ci/constitutional_surface_check.sh --selftest 2>&1 | tee -a doctrine-constitutional-surface-report.txt

      - name: EML EXP qualification artifact freshness
        run: |
          set -o pipefail
          # Presence/freshness of the pinned exhaustive-qualification artifacts
          # ONLY — the admitted-domain sweep is a local phase-boundary act and is never
          # re-executed in CI (EML-EXP-PRIMITIVE-0).
          bash scripts/ci/eml_exp_qualification_check.sh --check 2>&1 | tee eml-exp-qualification-report.txt

      - name: EML EXP qualification freshness selftest
        if: steps.gate.outputs.run_selftests == 'true'
        run: |
          set -o pipefail
          bash scripts/ci/eml_exp_qualification_check.sh --selftest 2>&1 | tee -a eml-exp-qualification-report.txt

      - name: EML LN qualification artifact freshness
        run: |
          set -o pipefail
          # Presence/freshness only — the admitted-domain sweep is a local
          # phase-boundary act, never CI (EML-LN-PRIMITIVE-0).
          bash scripts/ci/eml_ln_qualification_check.sh --check 2>&1 | tee eml-ln-qualification-report.txt

      - name: EML LN qualification freshness selftest
        if: steps.gate.outputs.run_selftests == 'true'
        run: |
          set -o pipefail
          bash scripts/ci/eml_ln_qualification_check.sh --selftest 2>&1 | tee -a eml-ln-qualification-report.txt

      - name: Doctrine anchor integrity
        run: |
          set -o pipefail
          bash scripts/ci/anchor_check.sh --check 2>&1 | tee doctrine-anchor-report.txt

      - name: Orientation receipt selftest
        if: steps.gate.outputs.run_selftests == 'true'
        run: |
          set -o pipefail
          bash scripts/ci/orient.sh --selftest 2>&1 | tee doctrine-orient-selftest-report.txt

      - name: Relay lint selftest
        if: steps.gate.outputs.run_selftests == 'true'
        run: |
          set -o pipefail
          bash scripts/ci/relay_lint.sh --selftest 2>&1 | tee doctrine-relay-selftest-report.txt

      - name: Overlay germ archaeology census check
        run: |
          set -o pipefail
          bash scripts/ci/overlay_germ_archaeology_census_check.sh --check 2>&1 | tee doctrine-overlay-germ-census-report.txt

      - name: Overlay germ archaeology census selftest
        if: steps.gate.outputs.run_selftests == 'true'
        run: |
          set -o pipefail
          bash scripts/ci/overlay_germ_archaeology_census_check.sh --selftest 2>&1 | tee doctrine-overlay-germ-census-selftest-report.txt

      - name: Embedder guide exemplars check
        run: |
          set -o pipefail
          bash scripts/ci/embedder_guide_exemplars_check.sh --check 2>&1 | tee doctrine-embedder-guide-exemplars-report.txt

      - name: Embedder guide exemplars selftest
        if: steps.gate.outputs.run_selftests == 'true'
        run: |
          set -o pipefail
          bash scripts/ci/embedder_guide_exemplars_check.sh --selftest 2>&1 | tee doctrine-embedder-guide-exemplars-selftest-report.txt

      - name: DOC-BUDGET check
        run: |
          set -o pipefail
          bash scripts/ci/doc_budget_check.sh --check 2>&1 | tee doctrine-doc-budget-report.txt

      - name: Detachability gate
        run: |
          set -o pipefail
          python3 scripts/ci/detachability_check.sh 2>&1 | tee doctrine-detachability-report.txt

      - name: Detachability selftest
        if: steps.gate.outputs.run_selftests == 'true'
        run: |
          set -o pipefail
          python3 scripts/ci/detachability_check.sh --selftest 2>&1 | tee doctrine-detachability-selftest-report.txt

      - name: Exit-proof coverage gate
        run: |
          set -o pipefail
          python3 scripts/ci/exit_proof_coverage_check.sh 2>&1 | tee doctrine-exit-proof-coverage-report.txt

      - name: Exit-proof coverage selftest
        if: steps.gate.outputs.run_selftests == 'true'
        run: |
          set -o pipefail
          python3 scripts/ci/exit_proof_coverage_check.sh --selftest 2>&1 | tee doctrine-exit-proof-coverage-selftest-report.txt

      - name: Scenario residue gate
        run: |
          set -o pipefail
          python3 scripts/ci/scenario_residue_check.sh 2>&1 | tee doctrine-scenario-residue-report.txt

      - name: Scenario residue selftest
        if: steps.gate.outputs.run_selftests == 'true'
        run: |
          set -o pipefail
          python3 scripts/ci/scenario_residue_check.sh --selftest 2>&1 | tee doctrine-scenario-residue-selftest-report.txt

      - name: Artifact provenance gate
        run: |
          set -o pipefail
          python3 scripts/ci/artifact_provenance_check.py 2>&1 | tee doctrine-artifact-provenance-report.txt

      - name: Artifact provenance selftest
        if: steps.gate.outputs.run_selftests == 'true'
        run: |
          set -o pipefail
          python3 scripts/ci/artifact_provenance_check.py --selftest 2>&1 | tee doctrine-artifact-provenance-selftest-report.txt

      - name: DOC-BUDGET selftest
        if: steps.gate.outputs.run_selftests == 'true'
        run: |
          set -o pipefail
          bash scripts/ci/doc_budget_check.sh --selftest 2>&1 | tee doctrine-doc-budget-selftest-report.txt

      - name: Rule expiry check
        run: |
          set -o pipefail
          bash scripts/ci/rule_expiry_check.sh --check 2>&1 | tee doctrine-rule-expiry-report.txt

      - name: Lifecycle schema gate (PR inventory/lifecycle TSV)
        if: github.event_name == 'pull_request'
        run: |
          set -o pipefail
          bash scripts/ci/test_lifecycle_expiry_check.sh --scheduled 2>&1 | tee doctrine-lifecycle-expiry-report.txt
          bash scripts/ci/lifecycle_schema_pr_gate.sh \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.sha }}" 2>&1 | tee doctrine-lifecycle-schema-gate-report.txt

      - name: Track-closeout selftest
        if: steps.gate.outputs.run_selftests == 'true'
        run: |
          set -o pipefail
          bash scripts/ci/track_closeout.sh --prove 2>&1 | tee doctrine-track-closeout-selftest-report.txt

      - name: Closeout artifact expiry (wall-clock)
        run: |
          set -o pipefail
          bash scripts/ci/track_closeout.sh --artifact-expiry 2>&1 | tee doctrine-closeout-artifact-expiry-report.txt

      - name: Track-closeout deletion guard (PR)
        if: github.event_name == 'pull_request'
        run: |
          set -o pipefail
          bash scripts/ci/track_closeout.sh --deletion-guard \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.sha }}" 2>&1 | tee doctrine-track-closeout-deletion-guard-report.txt

      - name: AGENTS stub check
        run: |
          set -o pipefail
          bash scripts/ci/agents_stub_check.sh --check 2>&1 | tee doctrine-agents-stub-report.txt

      - name: AGENTS stub selftest
        if: steps.gate.outputs.run_selftests == 'true'
        run: |
          set -o pipefail
          bash scripts/ci/agents_stub_check.sh --selftest 2>&1 | tee doctrine-agents-stub-selftest-report.txt

      - name: Doctrine self-test
        if: steps.gate.outputs.run_selftests == 'true'
        run: |
          set -o pipefail
          bash scripts/ci/doctrine_selftest.sh | tee doctrine-selftest-report.txt

      - name: Doctrine exec review context selftest
        if: steps.gate.outputs.run_selftests == 'true'
        run: |
          set -o pipefail
          python3 scripts/ci/doctrine_exec_review_context_selftest.py --selftest 2>&1 | tee doctrine-exec-review-context-selftest-report.txt

      - name: Doctrine scan (PR delta)
        if: github.event_name == 'pull_request'
        run: |
          set -o pipefail
          bash scripts/ci/doctrine_pr_scan.sh \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.sha }}" | tee doctrine-scan-report.txt

      - name: Triage spam check (PR)
        if: github.event_name == 'pull_request'
        run: |
          set -o pipefail
          bash scripts/ci/inspect_spam_check.sh "${{ github.head_ref }}" > doctrine-triage-report.txt
          cat doctrine-triage-report.txt

      - name: Doctrine scan (whole-tree)
        # Also on workflow_dispatch: without it a dispatched run executed the
        # selftests and NO scan at all, so a green "Doctrine Scan" proved the
        # scanner was self-consistent and said nothing about the tree. That is
        # the one reading a dispatch invites, and it is the only pre-merge way
        # for a webchat orchestrator to get whole-tree HEURISTIC coverage --
        # a PR delta-scopes HEURISTIC scans by design. Costs 3s.
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          set -o pipefail
          bash scripts/ci/doctrine_scan.sh | tee doctrine-scan-report.txt

      - name: Publish doctrine reports
        if: always()
        run: |
          {
            echo "## Doctrine self-test"
            echo '```'
            cat doctrine-selftest-report.txt 2>/dev/null || true
            echo '```'
            echo
            echo "## Doctrine exec review context selftest"
            echo '```'
            cat doctrine-exec-review-context-selftest-report.txt 2>/dev/null || true
            echo '```'
            echo
            echo "## Sanctioned surface digest freshness"
            echo '```'
            cat doctrine-digest-report.txt 2>/dev/null || true
            echo '```'
            echo
            echo "## Orientation digest freshness"
            echo '```'
            cat doctrine-orientation-report.txt 2>/dev/null || true
            echo '```'
            echo
            echo "## Plan struct typing census"
            echo '```'
            cat doctrine-plan-struct-typing-census-report.txt 2>/dev/null || true
            echo '```'
            echo
            echo "## Write-door band delta census"
            echo '```'
            cat doctrine-write-door-band-delta-census-report.txt 2>/dev/null || true
            echo '```'
            echo
            echo "## Lifecycle schema gate"
            echo '```'
            cat doctrine-lifecycle-schema-gate-report.txt 2>/dev/null || true
            echo '```'
            echo
            echo "## Constitutional surface census"
            echo '```'
            cat doctrine-constitutional-surface-report.txt 2>/dev/null || true
            echo '```'
            echo
            echo "## Doctrine scan"
            echo '```'
            cat doctrine-scan-report.txt 2>/dev/null || true
            echo '```'
            echo
            echo "## Doctrine triage / spam check"
            echo '```'
            cat doctrine-triage-report.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload doctrine reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctrine-scan-reports
          path: |
            doctrine-digest-report.txt
            doctrine-orientation-report.txt
            doctrine-plan-struct-typing-census-report.txt
            doctrine-write-door-band-delta-census-report.txt
            doctrine-constitutional-surface-report.txt
            doctrine-lifecycle-schema-gate-report.txt
            doctrine-selftest-report.txt
            doctrine-exec-review-context-selftest-report.txt
            doctrine-scan-report.txt
            doctrine-triage-report.txt
          if-no-files-found: ignore
