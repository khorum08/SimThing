name: Infra Rerun

# Re-runs a CI run that died of GitHub Actions INFRASTRUCTURE, never of content.
#
# WHY THIS EXISTS. Runs are lost to "Failed to resolve action download info /
# Service Unavailable" at job setup, or cancelled mid-flight by the platform.
# Both look identical to a red gate, so a human classifies and re-runs by hand.
# The classification is mechanical, so encode it once instead of paying it every
# time. (Measured 2026-08-06 on PR #1664: doctrine-scan died in "Getting action
# download info" after two platform retries; doctrine-exec was cancelled at 15m.
# Both passed unchanged on rerun.)
#
# THE DISCRIMINATOR — this is the whole safety argument, and it was CORRECTED
# against the real data rather than reasoned into place. The first draft said
# "infra deaths have zero failed steps"; measuring the two 2026-08-06 cases
# showed that is wrong. What actually holds:
#
#   * doctrine-scan (resolve failure): exactly one failed step, "Set up job"
#   * doctrine-exec (platform cancel):  no steps at all
#
# "Set up job" is PLATFORM-OWNED. It provisions the runner and resolves actions,
# entirely before any repository code exists on disk — nothing in this repo can
# make it fail. So the rule is: re-run only when every failed step is one of
# those pre-code platform steps (or there are none). A content failure always
# fails a step we authored, and this workflow then does nothing: the red stands.
# It can never mask a failing gate, a flaky test, or a bad commit.
#
# It deliberately uses NO third-party actions and no checkout — the rerunner must
# not be vulnerable to the resolve failure it repairs.

on:
  workflow_run:
    workflows: ["Doctrine Scan", "Doctrine Exec", "Clearance"]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    if: >-
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Re-run only if no step of ours failed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WF: ${{ github.event.workflow_run.name }}
        shell: bash
        run: |
          set -euo pipefail

          # Bound the loop. Two auto-attempts is enough for a transient outage;
          # a third means it is not transient and a human should look.
          if [ "${ATTEMPT}" -ge 3 ]; then
            echo "INFRA-RERUN: DECLINED (attempt ${ATTEMPT} >= 3) — not transient, escalating to a human."
            exit 0
          fi

          # Steps GitHub owns and runs before any repository code is on disk.
          # A failure here is provisioning or action resolution — never ours.
          PLATFORM_STEPS='["Set up job","Set up runner","Set up runners"]'

          ours="$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/attempts/${ATTEMPT}/jobs" \
            --paginate -q "[.jobs[].steps[]? | select(.conclusion==\"failure\") | .name]
                           | map(select(. as \$n | ${PLATFORM_STEPS} | index(\$n) | not))
                           | join(\", \")")"

          if [ -n "${ours}" ]; then
            echo "INFRA-RERUN: DECLINED — authored step(s) failed in '${WF}': ${ours}"
            echo "That is a CONTENT failure. The red stands and is yours to fix."
            exit 0
          fi

          echo "INFRA-RERUN: ACCEPTED — '${WF}' concluded ${CONCLUSION}; every failed step was platform-owned."
          echo "The job never reached repository code, so this is infrastructure. Re-running attempt $((ATTEMPT + 1))."
          gh api -X POST "repos/${REPO}/actions/runs/${RUN_ID}/rerun-failed-jobs" \
            || gh api -X POST "repos/${REPO}/actions/runs/${RUN_ID}/rerun"
